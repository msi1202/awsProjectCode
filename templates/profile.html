<!DOCTYPE html>
<html>
<body>
    <h2>User Profile</h2>
    <p><strong>Username:</strong> {{ user[0] }}</p>
    <p><strong>First Name:</strong> {{ user[2] }}</p>
    <p><strong>Last Name:</strong> {{ user[3] }}</p>
    <p><strong>Email:</strong> {{ user[4] }}</p>
    <p><strong>Address:</strong> {{ user[5] }}</p>
    
    <hr>
    <h3>Uploaded Document Details</h3>
    {% if user[6] %}
        <p><strong>File Name:</strong> {{ user[6] }}</p>
        <p><strong>Total Word Count:</strong> {{ user[7] }}</p>
        <form action="/download/{{ user[6] }}" method="get">
            <button type="submit">Download {{ user[6] }}</button>
        </form>
    {% else %}
        <p>No file was uploaded.</p>
    {% endif %}
    
    <br><br>
    <a href="/">Logout</a>
</body>
</html>
